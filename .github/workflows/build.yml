name: Build

# Continuous integration only. Releasing is deliberately NOT triggered from here:
# pushing a tag no longer publishes anything. Use the Prepare Release workflow,
# which builds the artifacts into a draft release for a human to review and publish.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Least privilege: CI only reads the repo. Jobs that need more request it themselves.
permissions:
  contents: read

# Supersede in-flight PR builds, but never cancel a main build — a release
# verifies against the build check for its commit.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The job id and matrix key ORDER below determine the check names
  # ("build (windows-2022, win32)", ...) that the `main` ruleset requires.
  # Renaming the job, or reordering os/platform, breaks merges into main until
  # the ruleset's required status checks are updated to match.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win32
          - os: macos-latest
            platform: darwin
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      # `ci` not `install`: installs exactly what package-lock.json pins and fails
      # if the lockfile has drifted from package.json, so CI cannot silently test a
      # different dependency tree than a release builds.
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Make distributables
        run: npm run make

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codeherd-${{ matrix.platform }}
          path: out/make/**/*
