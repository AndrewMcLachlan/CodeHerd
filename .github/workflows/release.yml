name: Release

# Runs when a GitHub release is published — i.e. when a human publishes the draft that
# Prepare Release staged, which is also what mints the version tag.
#
# This workflow publishes nothing. CodeHerd distributes through the GitHub release
# itself, so by this point the artifacts are already live; the job of this workflow is
# to verify loudly that what went out is coherent, and to leave a record of it. It is a
# tripwire, not a step in the pipeline: a failure here means a human needs to look at
# the release, not that the release did not happen.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - name: Verify the tag matches package.json
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name }}"
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION at this commit."
            exit 1
          fi
          echo "Tag $TAG matches package.json."

      # A release built from a commit that never reached main would be unreproducible
      # from the default branch's history.
      - name: Verify the commit is on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::The released commit is not an ancestor of main. Releases must ship reviewed, merged code."
            exit 1
          fi
          echo "Released commit is on main."

      # Whether a pre-release VERSION should be marked as a pre-release RELEASE is a
      # judgement call — a 1.0 beta that leads the 0.x line is deliberately the latest
      # release — so this reports rather than fails. Failing on a decision the maintainer
      # made on purpose only teaches people to ignore the check.
      #
      # One direction is never a judgement call and still fails hard.
      - name: Check the pre-release flag
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name }}"
          ACTUAL="${{ github.event.release.prerelease }}"
          case "$TAG" in
            *-*) ;;
            *)
              # A stable version hidden behind the pre-release flag is simply lost: it
              # never becomes /releases/latest, so nobody on a stable build is told about
              # it, and the update checker has nothing to offer them (#106).
              if [ "$ACTUAL" = "true" ]; then
                echo "::error::$TAG is a stable version marked as a pre-release. It will not appear as /releases/latest and stable users will never be offered it. Untick 'pre-release' on the release."
                exit 1
              fi
              ;;
          esac
          if [ "$ACTUAL" = "true" ]; then
            echo "::notice::$TAG is a pre-release: it stays out of /releases/latest, so only users already on a pre-release build will be offered it."
          else
            echo "::notice::$TAG is /releases/latest: everyone on a stable build will be offered it."
          fi

      - name: Verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name }}"
          ASSETS=$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name')
          echo "$ASSETS"
          need() {
            if ! echo "$ASSETS" | grep -q -- "$1"; then
              echo "::error::Published release $TAG is missing an asset matching: $1"
              exit 1
            fi
          }
          need "Setup.exe"
          need "CodeHerd-win32-x64-.*\.zip"
          need "CodeHerd-darwin-.*\.zip"
          need "CodeHerd-darwin-.*\.dmg"
          need "CodeHerd-linux-x64-.*\.zip"
          need "codeherd_.*_amd64\.deb"
          need "SHA256SUMS"
          echo "All expected assets present."

      - name: Summary
        run: |
          {
            echo "### Release ${{ github.event.release.tag_name }} verified"
            echo ""
            echo "- Pre-release: \`${{ github.event.release.prerelease }}\`"
            echo "- Offered to: \`${{ github.event.release.prerelease == true && 'pre-release users only' || 'everyone on a stable build' }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Tag matches package.json, commit is on main, all expected assets present."
          } >> "$GITHUB_STEP_SUMMARY"
