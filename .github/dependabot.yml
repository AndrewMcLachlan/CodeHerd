version: 2

updates:
  - package-ecosystem: "npm"
    directory: /
    schedule:
      interval: "weekly"
      timezone: Australia/Brisbane
      day: tuesday
      time: "08:00"
    groups:
      dev-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      prod-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # An Electron major is a Chromium, Node and V8 jump with breaking API changes,
      # so it lands as planned work rather than a bump to merge. Tracked on the 1.1
      # milestone; drop this entry when that upgrade is being done.
      - dependency-name: "electron"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 20

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      timezone: "Australia/Brisbane"
      day: tuesday
      time: "08:00"
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 20
